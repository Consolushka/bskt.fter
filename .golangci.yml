version: "2"
run:
  modules-download-mode: readonly
  tests: true
linters:
  enable:
    - bodyclose
    - contextcheck
    - copyloopvar
    - depguard
    - errorlint
    - gocyclo
    - nilerr
    - nilnil
    - noctx
    - nolintlint
    - revive
    - testifylint
    - wrapcheck
  settings:
    depguard:
      rules:
        main:
          deny:
            - pkg: github.com/pkg/errors
              desc: use standard library errors package
    gocyclo:
      min-complexity: 20
    govet:
      enable:
        - shadow
    revive:
      severity: warning
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
